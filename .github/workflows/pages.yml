name: Deploy to GitHub Pages

# main に push したら、リポジトリの中身をそのまま GitHub Pages に出す(ビルドなし)。
# Settings → Pages の Source は「GitHub Actions」にしておくこと。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 近接した push で配信が取り合わないように、1本ずつ流す
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
